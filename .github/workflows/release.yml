# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) tests, builds and publishes a release
# with the zipped app attached. The app is signed ad hoc, as a local build is.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # bundle.sh reads the version from the tag and the build number from the history

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build
        run: Scripts/bundle.sh

      - name: Zip
        run: |
          ZIP="build/Hand-of-Freedom-${GITHUB_REF_NAME#v}.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/Hand of Freedom.app" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "Hand of Freedom ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
